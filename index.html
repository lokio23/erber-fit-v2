<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="ERBER FIT — Science-based hypertrophy tracking" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet" />
    <title>ERBER FIT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Production only. In dev, Vite serves modules at stable URLs whose contents
      // change on every edit, so the worker's cache-first asset strategy would pin
      // the page to stale JS and make hot reloading silently useless.
      var isLocal = ['localhost', '127.0.0.1', '::1'].indexOf(location.hostname) !== -1
      if ('serviceWorker' in navigator && !isLocal) {
        window.addEventListener('load', () => {
          // Relative path: the app is served from a sub-path (/erber-fit-v2/ on
          // GitHub Pages), so '/sw.js' 404s and the worker never installs.
          navigator.serviceWorker.register('./sw.js').catch(() => {})
        })
      } else if ('serviceWorker' in navigator && isLocal) {
        // Clean up any worker registered before this guard existed.
        navigator.serviceWorker.getRegistrations()
          .then((regs) => regs.forEach((r) => r.unregister()))
          .catch(() => {})
        if (window.caches) caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {})
      }
    </script>
  </body>
</html>
